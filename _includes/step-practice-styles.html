<!-- Styles for practice problems worked in checked steps (assets/ts/src/common/step_practice.ts).
     The practice section goes in an element with the class "sp-practice"; every rule is scoped to
     it, so it wins over a page's own rules for buttons and inputs. Include it after
     practice-styles.html. -->
<style>
  /* Buttons take the page's own style; the main ones are blue. */
  .sp-practice .sp-primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  .sp-practice .sp-primary:hover { background: #1765cc; }
  .sp-practice [hidden] { display: none !important; }

  .sp-practice .sp-instructions { margin: 0 0 0.6rem; }
  .sp-practice .sp-instructions summary { cursor: pointer; font-weight: bold; font-size: 0.95em; }
  .sp-practice .sp-instructions[open] summary { margin-bottom: 0.4rem; }
  .sp-practice .sp-custom { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.1rem; margin: 0.5rem 0 0; }
  .sp-practice .sp-field { display: flex; align-items: center; gap: 0.4rem; margin: 0; font-size: 0.95em; color: #5f6368; }
  .sp-practice .sp-field select { width: auto; max-width: 100%; margin: 0; padding: 0.3rem 0.5rem; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 6px; background: #fff; color: #202124; font: inherit; }

  /* The problem, in a box with its label on the top border. */
  .sp-practice .sp-problem-box {
    position: relative;
    margin: 0.9rem 0 0.2rem;
    padding: 1.1rem 1.2rem 0.6rem;
    border: 1px solid rgba(128, 128, 128, 0.45);
    border-radius: 8px;
  }
  .sp-practice .sp-problem-title {
    position: absolute;
    top: 0;
    left: 0.9rem;
    transform: translateY(-50%);
    margin: 0;
    padding: 0 0.4rem;
    border: none;
    background: #fff;
    font-size: 1.05em;
  }
  @media (max-width: 600px) {
    .sp-practice .sp-problem-box { padding: 1rem 0.6rem 0.5rem; }
  }
  .sp-practice .sp-statement { overflow-x: auto; overflow-y: hidden; }
  .sp-practice .sp-statement p { margin: 0 0 0.5rem; }
  .sp-practice .sp-problem-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; margin: 0.4rem 0; }
  .sp-practice .sp-solution-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; margin: 1rem 0 0.4rem; }
  .sp-practice .sp-solution-head h3 { margin: 0; border: none; font-size: 1.1em; }
  .sp-practice .sp-hint-count { font-size: 0.85em; color: #5f6368; }

  /* The steps: one card each. */
  .sp-practice .sp-step {
    margin: 0 0 1rem;
    padding: 0.8rem 1rem;
    border: 1px solid rgba(128, 128, 128, 0.35);
    border-left-width: 4px;
    border-radius: 8px;
    background: rgba(128, 128, 128, 0.04);
  }
  .sp-practice .sp-step.sp-step-right { border-left-color: #188038; }
  .sp-practice .sp-step.sp-step-shown { border-left-color: #f9ab00; }
  .sp-practice .sp-step.sp-step-given { border-left-color: #1a73e8; }
  .sp-practice .sp-step-title { margin: 0 0 0.5rem; font-size: 1em; }
  .sp-practice .sp-step-intro { margin: 0 0 0.6rem; font-size: 0.92em; overflow-x: auto; overflow-y: hidden; }
  .sp-practice .sp-step-intro p { margin: 0 0 0.4rem; }
  .sp-practice .sp-entries { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem 1.6rem; }
  .sp-practice .sp-entry-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .sp-practice .sp-entry-label { white-space: nowrap; }
  .sp-practice .sp-entry {
    width: 3.6rem;
    margin: 0;
    padding: 0.25rem 0.2rem;
    border: 1px solid rgba(128, 128, 128, 0.45);
    border-radius: 6px;
    background: #fff;
    color: #000;
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .sp-practice .sp-entry:disabled { background: rgba(128, 128, 128, 0.08); }
  .sp-practice .sp-entry.sp-right { border: 2px solid #188038; background: rgba(24, 128, 56, 0.08); }
  .sp-practice .sp-entry.sp-wrong { border: 2px solid #c5221f; background: rgba(197, 34, 31, 0.07); }
  .sp-practice .sp-entry.sp-shown { border: 2px solid #f9ab00; background: #fef7e0; }

  /* Brackets around a vector or matrix of entries, drawn by ::before and ::after. */
  .sp-practice .sp-bracket {
    position: relative;
    display: inline-grid;
    gap: 0.25rem 0.35rem;
    padding: 0.3rem 0.55rem;
    vertical-align: middle;
  }
  .sp-practice .sp-bracket::before, .sp-practice .sp-bracket::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0.35rem;
    border: 2px solid #3c4043;
  }
  .sp-practice .sp-bracket::before { left: 0; border-right: none; }
  .sp-practice .sp-bracket::after { right: 0; border-left: none; }

  /* Yes/No questions: a split pill of two radio buttons. */
  .sp-practice .sp-yes-no { display: inline-flex; border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 999px; overflow: hidden; background: #fff; }
  .sp-practice .sp-yn-option { position: relative; display: inline-flex; margin: 0; cursor: pointer; }
  .sp-practice .sp-yn-option + .sp-yn-option { border-left: 1px solid rgba(128, 128, 128, 0.5); }
  .sp-practice .sp-yn-option input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .sp-practice .sp-yn-option span { padding: 0.3rem 1rem; min-width: 3.2rem; text-align: center; color: #3c4043; }
  .sp-practice .sp-yn-option:hover span { background: rgba(128, 128, 128, 0.1); }
  .sp-practice .sp-yn-option input:checked + span { background: #1a73e8; color: #fff; }
  .sp-practice .sp-yn-option input:focus-visible + span { outline: 2px solid #1a73e8; outline-offset: -4px; }
  .sp-practice .sp-yn-option:has(input:disabled) { cursor: not-allowed; opacity: 0.7; }
  .sp-practice .sp-yes-no.sp-right { border: 2px solid #188038; }
  .sp-practice .sp-yes-no.sp-wrong { border: 2px solid #c5221f; }
  .sp-practice .sp-yes-no.sp-shown { border: 2px solid #f9ab00; }

  .sp-practice .sp-step-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.8rem; }
  .sp-practice .sp-step-actions button { font-size: 0.9em; }
  .sp-practice .sp-feedback { margin: 0.6rem 0 0; font-size: 0.92em; overflow-x: auto; overflow-y: hidden; }
  .sp-practice .sp-feedback:empty { display: none; }
  .sp-practice .sp-feedback p { margin: 0 0 0.3rem; }
  .sp-practice .sp-feedback-right { color: #188038; font-weight: bold; }
  .sp-practice .sp-feedback-wrong { color: #c5221f; font-weight: bold; }
  .sp-practice .sp-feedback-note { color: #3d4144; }
  .sp-practice .sp-hint-box {
    margin: 0.6rem 0 0;
    padding: 0.6rem 0.8rem;
    border-left: 4px solid #f9ab00;
    border-radius: 6px;
    background: #fef7e0;
    font-size: 0.92em;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .sp-practice .sp-hint-box p { margin: 0 0 0.4rem; }
  .sp-practice .sp-hint-box p:last-child { margin: 0; }
  .sp-practice .sp-worked { margin: 0.6rem 0 0; font-size: 0.95em; overflow-x: auto; overflow-y: hidden; }
  .sp-practice .sp-worked:empty { display: none; }
  .sp-practice .sp-worked p { margin: 0 0 0.4rem; }
  .sp-practice .sp-more-steps { margin: 0 0 1rem; font-size: 0.9em; font-style: italic; color: #5f6368; }
  .sp-practice .sp-done {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1rem;
    margin: 0 0 1.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid #188038;
    border-left-width: 5px;
    border-radius: 6px;
    background: rgba(24, 128, 56, 0.08);
  }
  .sp-practice .sp-done strong { font-size: 1.05em; }
  .sp-practice .sp-done-suggest { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.8rem; margin: 0; }
</style>
